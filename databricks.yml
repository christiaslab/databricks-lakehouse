# Databricks Asset Bundle for the lakehouse project.
# See https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: databricks-lakehouse

include:
  - resources/*.yml

sync:
  exclude:
    - data/**   # raw CSVs live in the volume, not in the workspace files

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-e604ef6a-2b72.cloud.databricks.com
