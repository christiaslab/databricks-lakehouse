# Lakehouse pipeline: bronze -> silver (parallel) -> DQ gate -> gold dimensions (parallel) -> gold fact.
# Tasks run on serverless compute (no cluster specified).
resources:
  jobs:
    lakehouse_job:
      name: lakehouse_pipeline

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze/bronze_ingestion.ipynb

        # ---- silver: one task per source table, all depend only on bronze ----
        - task_key: silver_crm_cust_info
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver/crm/silver_crm_cust_info.ipynb

        - task_key: silver_crm_prd_info
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver/crm/silver_crm_prd_info.ipynb

        - task_key: silver_crm_sales_details
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver/crm/silver_crm_sales_details.ipynb

        - task_key: silver_erp_cust_az12
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver/erp/silver_erp_cust_az12.ipynb

        - task_key: silver_erp_loc_a101
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver/erp/silver_erp_loc_a101.ipynb

        - task_key: silver_erp_px_cat_g1v2
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver/erp/silver_erp_px_cat_g1v2.ipynb

        # ---- data quality gate: gold only runs on clean silver ----
        - task_key: silver_dq_checks
          depends_on:
            - {task_key: silver_crm_cust_info}
            - {task_key: silver_crm_prd_info}
            - {task_key: silver_crm_sales_details}
            - {task_key: silver_erp_cust_az12}
            - {task_key: silver_erp_loc_a101}
            - {task_key: silver_erp_px_cat_g1v2}
          notebook_task:
            notebook_path: ../notebooks/02_silver/silver_dq_checks.ipynb

        # ---- gold dimensions ----
        - task_key: gold_dim_customers
          depends_on: [{task_key: silver_dq_checks}]
          notebook_task:
            notebook_path: ../notebooks/03_gold/gold_dim_customers.ipynb

        - task_key: gold_dim_products
          depends_on: [{task_key: silver_dq_checks}]
          notebook_task:
            notebook_path: ../notebooks/03_gold/gold_dim_products.ipynb

        # ---- gold fact: needs both dimensions for surrogate keys ----
        - task_key: gold_fact_sales
          depends_on:
            - {task_key: gold_dim_customers}
            - {task_key: gold_dim_products}
          notebook_task:
            notebook_path: ../notebooks/03_gold/gold_fact_sales.ipynb
